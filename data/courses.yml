# Courses shown on the site. A course is published in a language only when it has a name,
# a description and at least one published task set or guide in that language.
courses:
  - id: software-engineering
    name:
      pl: "Inżynieria oprogramowania"
    summary:
      pl: "Praktyczny kurs w 30 laboratoriach: od terminala i Gita, przez testy, projektowanie i pracę w zespole, po API, wydanie i projekt zespołowy. Na tej stronie dostępny jest obecnie pierwszy zestaw zadań."
  - id: mechatronic-systems-programming
    name:
      pl: "Programowanie systemów mechatronicznych"
    summary:
      pl: "Programowanie w C++ na przykładzie symulatora przemysłowej linii sortującej: od narzędzi i podstaw sterowania, przez napęd taśmy, tryby pracy i awaryjny stop, po obsługę usterek, czujniki, scenariusze testowe i projekt końcowy. Ćwiczenia wykonuje się na zwykłym komputerze."
  - id: data-processing-exploration-analysis
    name:
      pl: "Przetwarzanie, eksploracja i analiza danych"
    summary:
      pl: "Praca z danymi na realistycznych studiach przypadków: od pytania i przygotowania danych, przez eksplorację i modele bazowe, po ocenę modeli, interpretację wyników i rekomendacje."
  - id: object-oriented-python
    name:
      pl: "Programowanie obiektowe w Pythonie"
    summary:
      pl: "Programowanie obiektowe w Pythonie na jednym rozwijanym projekcie gry RPG: porządkowanie kodu za pomocą klas, klas danych, typów wyliczeniowych, adnotacji typów, modułów i testów."
  - id: python-application-programming
    name:
      pl: "Programowanie aplikacji w języku Python"
    summary:
      pl: "Budowa aplikacji w Pythonie na jednym rozwijanym projekcie: walidacja i zapis danych, interfejs wiersza poleceń i raporty, utrzymanie kodu, API oraz zadania wykonywane w tle. Uzupełnieniem są przewodniki po przygotowaniu środowiska i nowoczesnym projekcie w Pythonie."
  - id: ai-and-machine-learning
    name:
      pl: "Sztuczna inteligencja i uczenie maszynowe"
    summary:
      pl: "Uczenie maszynowe poznawane interaktywnie: jak modele uczą się na błędach, od odległości do klastrów, od dobrych wyników do wiarygodnych modeli, od cech do decyzji modelu i od reprezentacji do zachowania modelu."
  - id: deep-learning
    name:
      pl: "Deep Learning"
    summary:
      pl: "Sieci neuronowe w praktyce z PyTorchem: od podstaw i trenowania sieci, przez sieci konwolucyjne, transfer learning, osadzenia, sieci rekurencyjne, mechanizm uwagi i modele językowe, po autoenkodery, modele dyfuzyjne, ocenę i wdrażanie modeli. Materiały są w rozbudowie."
  - id: introduction-to-ai
    name:
      pl: "Podstawy sztucznej inteligencji"
    summary:
      pl: "Wprowadzenie do podstawowych pojęć i metod sztucznej inteligencji."
  - id: engineering-project
    name:
      pl: "Projekt inżynierski"
    summary:
      pl: "Praktyczne wskazówki do projektu inżynierskiego: od określenia problemu i zakresu, przez projekt, implementację i weryfikację rozwiązania, po dokumentowanie decyzji i prezentację rezultatów."
  - id: diploma-seminar
    name:
      pl: "Seminarium dyplomowe"
    summary:
      pl: "Praktyczne wskazówki do pracy dyplomowej: od tematu i celu, przez źródła, strukturę i argumentację, po wnioski i prezentację wyników."
  - id: masters-seminar
    name:
      pl: "Seminarium magisterskie"
    summary:
      pl: "Praktyczne wskazówki do pracy badawczej: od problemu i pytań badawczych, przez stan wiedzy, dobór metod i sposób weryfikacji, po analizę wyników, odtwarzalność i wnioski."
