# Teaching repositories shown in the repository catalog (/courses/repositories/) and referenced by
# published materials. Facts checked against each repository's default branch on 2026-11-14:
# technologies (pyproject.toml, CMakeLists.txt, README), material languages, license files, and
# issue templates (.github/ISSUE_TEMPLATE/). A repository with a single MIT LICENSE for the whole
# project is recorded as MIT for code and content.
repositories:
  - id: software-engineering-in-practice
    name: Software Engineering in Practice
    url: https://github.com/michalmaj/software-engineering-in-practice
    default_branch: main
    maturity: not_assessed
    description:
      pl: "Dwujęzyczny kurs laboratoryjny inżynierii oprogramowania: od terminala i Gita, przez testy, projektowanie i CI, po API, wydania, incydenty i przekazanie projektu. Ścieżki: Python, Go i Java."
    technologies: [Python, Go, Java]
    content_languages: [en, pl]
    licenses: {code: MIT, content: CC-BY-4.0}
    issue_templates: true
