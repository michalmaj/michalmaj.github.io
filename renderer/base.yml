# Renderer configuration shared by every build (mkdocs.yml format).
# Read by Zensical and by MkDocs + Material. No hooks, no plugins.
use_directory_urls: true
theme:
  name: material
  font: false
  # The colour scheme toggle (palette) is generated per build with labels from data/i18n.
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
# Visual system: design tokens and component styles (renderer/theme/), copied into every build.
extra_css:
  - stylesheets/teaching-hub/tokens.css
  - stylesheets/teaching-hub/theme.css
extra:
  generator: false
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    # Links between builds (e.g. /licensing/) are verified by the pipeline.
    absolute_links: ignore
